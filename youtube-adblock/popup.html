<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>유튜브 광고 차단</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff; --fg: #111111; --muted: #666666; --accent: #e53935; --off: #bdbdbd;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1e1e1e; --fg: #f0f0f0; --muted: #a0a0a0; --off: #555555; }
    }
    body {
      margin: 0; width: 240px; padding: 16px;
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg); color: var(--fg);
    }
    h1 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
    h1 img { width: 20px; height: 20px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
    .label { font-size: 13px; }
    .switch { position: relative; width: 42px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; background: var(--off); border-radius: 24px; cursor: pointer;
      transition: background .15s;
    }
    .slider::before {
      content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: transform .15s;
    }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider::before { transform: translateX(18px); }
    .count { font-size: 28px; font-weight: 700; text-align: center; margin: 14px 0 2px; }
    .caption { font-size: 12px; color: var(--muted); text-align: center; }
    .status { font-size: 12px; color: var(--muted); margin-top: 12px; text-align: center; }
    button.reset {
      margin-top: 10px; width: 100%; padding: 6px; font-size: 12px; cursor: pointer;
      background: transparent; color: var(--muted); border: 1px solid var(--off); border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="">유튜브 광고 차단</h1>
  <div class="row">
    <span class="label">차단 켬</span>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>
  <div class="count" id="count">0</div>
  <div class="caption">건너뛴 영상 광고</div>
  <button class="reset" id="reset">횟수 초기화</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
