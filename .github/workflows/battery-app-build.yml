name: Battery App Build

on:
  push:
    paths:
      - 'battery-app/**'
      - '.github/workflows/battery-app-build.yml'
  pull_request:
    paths:
      - 'battery-app/**'
  workflow_dispatch:

concurrency:
  group: battery-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: battery-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ubuntu-latest 러너에는 Android SDK가 ANDROID_HOME 에 미리 설치되어 있어
      # settings.gradle.kts 가 :app 모듈을 포함한다. 없는 플랫폼/빌드툴은 AGP가 내려받는다.
      - name: Core unit tests
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: battery-app-debug-apk
          path: battery-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-app-test-reports
          path: |
            battery-app/core/build/reports/tests/
            battery-app/core/build/test-results/
            battery-app/app/schemas/
          if-no-files-found: ignore
